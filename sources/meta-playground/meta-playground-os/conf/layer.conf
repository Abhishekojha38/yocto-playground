# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-playground-os"
BBFILE_PATTERN_meta-playground-os = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-playground-os = "10"

LAYERDEPENDS_meta-playground-os = "core"
LAYERSERIES_COMPAT_meta-playground-os = "walnascar"
