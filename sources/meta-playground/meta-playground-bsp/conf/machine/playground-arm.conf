# Include a base machine configuration
include conf/machine/qemuarm.conf
include include/playground-common.conf

# Preferred kernel
PREFERRED_PROVIDER_virtual/kernel = "linux-playground"
KBUILD_DEFCONFIG = "defconfig-arm"

# added to the override system, allowing recipes and .bbappend files to apply
# modifications specifically for this machine.
MACHINEOVERRIDES =. "playground-arm:"
